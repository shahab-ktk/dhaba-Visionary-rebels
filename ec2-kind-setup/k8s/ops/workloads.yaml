apiVersion: v1
kind: ConfigMap
metadata:
  name: monitor-state
data:
  last-run: never
  last-status: unknown
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ecr-refresh-state
data:
  last-refresh: never
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cluster-monitor
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 45
  jobTemplate:
    spec:
      activeDeadlineSeconds: 50
      backoffLimit: 0
      template:
        spec:
          serviceAccountName: cluster-monitor
          restartPolicy: Never
          imagePullSecrets:
            - name: ecr-registry
          containers:
            - name: checks
              image: 542811240173.dkr.ecr.ap-southeast-2.amazonaws.com/dhaba-visionary-rebel/ops-monitor:be6c64e328398d91433041201f45c2dc8c2d6b0e
              command: ["/opt/monitor/run-checks.sh"]
              volumeMounts:
                - name: monitor-scripts
                  mountPath: /opt/monitor
                  readOnly: true
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                runAsNonRoot: true
          volumes:
            - name: monitor-scripts
              configMap:
                name: monitor-scripts
                defaultMode: 0555
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ecr-secret-refresh
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      activeDeadlineSeconds: 120
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: ecr-secret-refresher
          restartPolicy: OnFailure
          hostNetwork: true
          dnsPolicy: ClusterFirstWithHostNet
          securityContext:
            fsGroup: 1000
          containers:
            - name: refresh
              image: python:3.12-slim
              command: ["/bin/sh", "-c"]
              args:
                - pip install --no-cache-dir --target=/tmp/python-packages boto3 && PYTHONPATH=/tmp/python-packages python /scripts/refresh-ecr-secret.py
              env:
                - name: AWS_REGION
                  value: ap-southeast-2
                - name: AWS_ACCOUNT
                  value: "542811240173"
                - name: TEAM
                  value: visionary-rebel
                - name: PYTHONPATH
                  value: /tmp/python-packages
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                runAsNonRoot: true
                runAsUser: 1000
              volumeMounts:
                - name: refresh-script
                  mountPath: /scripts
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: refresh-script
              configMap:
                name: ecr-refresh-script
            - name: tmp
              emptyDir: {}
