apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

resources:
  - namespace.yaml
  - ../../base

patches:
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: dhaba
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          cert-manager.io/cluster-issuer: letsencrypt-prod
      - op: replace
        path: /spec/rules/0/host
        value: visionary-rebel-production.duckdns.org
      - op: add
        path: /spec/tls
        value:
          - hosts:
              - visionary-rebel-production.duckdns.org
            secretName: dhaba-production-tls
  - target:
      version: v1
      kind: ConfigMap
      name: dhaba-config
    patch: |-
      - op: replace
        path: /data/NGINX_SERVICE_DOMAIN
        value: .production.svc.cluster.local
  - target:
      group: apps
      version: v1
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
