apiVersion: apps/v1
kind: Deployment
metadata:
  name: kitchen-worker
  labels:
    app: kitchen-worker
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: kitchen-worker
  template:
    metadata:
      labels:
        app: kitchen-worker
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: kitchen-worker
      imagePullSecrets:
        - name: ecr-registry
      containers:
        - name: kitchen-worker
          image: 542811240173.dkr.ecr.ap-southeast-2.amazonaws.com/dhaba-visionary-rebel/kitchen-worker:be6c64e328398d91433041201f45c2dc8c2d6b0e
          env:
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/dhaba
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: dhaba-db
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dhaba-db
                  key: DB_PASSWORD
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: dhaba-config
                  key: REDIS_URL
            - name: COOK_MILLIS
              valueFrom:
                configMapKeyRef:
                  name: dhaba-config
                  key: COOK_MILLIS
            - name: APP_VERSION
              valueFrom:
                configMapKeyRef:
                  name: dhaba-config
                  key: APP_VERSION
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - test -n "$(find /tmp/kitchen-heartbeat -mmin -1)"
            periodSeconds: 10
            failureThreshold: 36
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - test -n "$(find /tmp/kitchen-heartbeat -mmin -1)"
            periodSeconds: 15
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - test -n "$(find /tmp/kitchen-heartbeat -mmin -1)"
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
