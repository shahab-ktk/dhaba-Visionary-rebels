# Template: the image entrypoint replaces ${NGINX_LOCAL_RESOLVERS} at container start.
#
# The API hosts are looked up when a request arrives (variable + resolver), not when
# Nginx starts. That way the container starts on its own, and also after the API
# Services are created in Kubernetes. Service names must match the Kubernetes Services.

resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/menu {
        set $menu_api http://menu-api${NGINX_SERVICE_DOMAIN}:8000;
        rewrite ^/api/menu(.*)$ /menu$1 break;
        proxy_pass $menu_api;
    }

    location /api/orders {
        set $orders_api http://orders-api${NGINX_SERVICE_DOMAIN}:8080;
        rewrite ^/api/orders(.*)$ /orders$1 break;
        proxy_pass $orders_api;
    }

    location = /api/info {
        set $orders_api http://orders-api${NGINX_SERVICE_DOMAIN}:8080;
        rewrite ^/api/info$ /info break;
        proxy_pass $orders_api;
    }

    location /api/stats {
        set $stats_api http://stats-api${NGINX_SERVICE_DOMAIN}:9000;
        rewrite ^/api/stats(.*)$ /stats$1 break;
        proxy_pass $stats_api;
    }

    # Docker and Kubernetes health checks
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        try_files /visionary-rebels.html =404;
    }

    # Hashed build assets can be cached for a long time
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths fall back to index.html
    location / {
        try_files $uri /index.html;
    }
}
